app = "whiteboard-beta"
primary_region = "iad" 

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0 
  processes = ["app"]

  # Health check 
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "info"
  BEHIND_TLS_PROXY = "true"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  swap_size_mb = 0

[deploy]
  strategy = "rolling" # Zero-downtime deployments

